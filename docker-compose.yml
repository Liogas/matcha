services:
  database:
    image: postgres:17
    userns_mode: "keep-id:uid=999,gid=999"
    sysctls:
      net.ipv4.ping_group_range: "999 999"
    container_name: matcha_database
    environment: # NE PAS LAISSER LES VALEURS BRUTS
      POSTGRES_DB: matcha
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  backend:
    build:
      context: ./backend
    container_name: matcha_backend
    depends_on:
      - database
    environment: # NE PAS LAISSER LES VALEURS BRUTS
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: matcha
      DB_USER: admin
      DB_PASSWORD: admin
    ports:
      - "18080:18080"

  # frontend:
  #   build:
  #     context: ./frontend
  #   container_name: matcha_frontend
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
    