map $request_method $login_limit_key {
    default "";
    POST $binary_remote_addr;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $login_limit_key zone=login_per_ip:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=email_resend_per_ip:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=password_reset_per_ip:10m rate=2r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location = /api/auth/login {
        limit_req zone=login_per_ip burst=5 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:18080;
    }

    location = /api/auth/email/resend {
        limit_req zone=email_resend_per_ip burst=1 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:18080;
    }

    location = /api/auth/password-reset/request {
        limit_req zone=password_reset_per_ip burst=1 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:18080;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:18080;
    }
}
